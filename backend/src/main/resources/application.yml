server:
  port: 8080

spring:
  application:
    name: livestock-trace

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/agritrust}

app:
  jwt:
    # DEV-ONLY default secret. Override with the JWT_SECRET env var for production.
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-any-real-deployment-min-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  public:
    trace-base-url: ${PUBLIC_TRACE_BASE_URL:http://localhost:5173/trace}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,*}
  bootstrap:
    admin:
      # DEV-ONLY convenience: creates exactly one ADMIN account at startup if none exists yet.
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@agritrust.com}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:password}
      full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:System Admin}

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: debug
